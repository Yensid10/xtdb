x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: '1.0.0'
  publishedVersionMetadata:
    releaseNote: >-
      Initial release of XTDB for Google Cloud Marketplace.
    releaseTypes:
    - Feature
    recommended: true
  images:
    xtdb:
      properties:
        xtdbRegistry:
          type: REGISTRY
        xtdbRepository:
          type: REPO_WITHOUT_REGISTRY
        xtdbTag:
          type: TAG
    kafka:
      properties:
        kafkaRegistry:
          type: REGISTRY
        kafkaRepository:
          type: REPO_WITHOUT_REGISTRY
        kafkaTag:
          type: TAG
    tlsConverter:
      properties:
        tlsConverterRegistry:
          type: REGISTRY
        tlsConverterRepository:
          type: REPO_WITHOUT_REGISTRY
        tlsConverterTag:
          type: TAG

# Adapted from postgresql's schema.yaml
properties:
  name:
    type: string
    default: "xtdb-kubernetes-deployment"
    description: "Fixed application deployment name"
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE
  xtdb.serviceAccount:
    type: string
    title: XTDB Service Account
    x-google-marketplace:
      type: SERVICE_ACCOUNT
      serviceAccount:
        description: "The service account for XTDB."
  xtdb.adminPassword:
    type: string
    title: XTDB Admin Password
    description: "Password for the XTDB admin user. This is automatically generated."
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 16
  xtdb.tls.enabled:
    type: string
    title: Enable TLS/SSL
    description: "Enable TLS/SSL for secure connections to XTDB"
    default: "true"
    x-google-marketplace:
      type: STRING
  xtdb.tls.certificate:
    type: string
    title: TLS Certificate Secret
    description: "Name of Kubernetes Secret containing TLS certificate and key"
    x-google-marketplace:
      type: TLS_CERTIFICATE
      tlsCertificate:
        generatedProperties:
          base64EncodedPrivateKey: xtdb.tls.base64EncodedPrivateKey
          base64EncodedCertificate: xtdb.tls.base64EncodedCertificate
  xtdb.tls.keystorePassword:
    type: string
    title: TLS Keystore Password
    description: "Password for the Java keystore that will store the TLS certificate"
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 16
  xtdbConfig.gcpProjectId:
    type: string
    title: GCP Project ID
    description: The Google Cloud project ID where XTDB will run.
    x-google-marketplace:
      type: STRING
  xtdbConfig.gcpBucket:
    type: string
    title: GCS Bucket 
    description: The GCS bucket to be used for XTDB storage.
    x-google-marketplace:
      type: STRING

required:
  - name
  - namespace
  - xtdb.serviceAccount
  - xtdbConfig.gcpProjectId
  - xtdbConfig.gcpBucket
  - xtdb.adminPassword
  - xtdb.tls.enabled
  - xtdb.tls.certificate
  - xtdb.tls.keystorePassword
