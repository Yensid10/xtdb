x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1
  publishedVersion: '1.0.0'
  publishedVersionMetadata:
    releaseNote: >-
      Initial release of XTDB for Google Cloud Marketplace.
    releaseTypes:
    - Feature
    recommended: true
  images:
    xtdb:
      properties:
        xtdbRegistry:
          type: REGISTRY
        xtdbRepository:
          type: REPO_WITHOUT_REGISTRY
        xtdbTag:
          type: TAG
    kafka:
      properties:
        kafkaRegistry:
          type: REGISTRY
        kafkaRepository:
          type: REPO_WITHOUT_REGISTRY
        kafkaTag:
          type: TAG

# Adapted from postgresql's schema.yaml
properties:
  name:
    type: string
    x-google-marketplace:
      type: NAME
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE
  # Image properties are now managed by the marketplace
  # The following properties will be generated automatically by the marketplace
  # based on the configuration above under x-google-marketplace.images
  
  # XTDB specific properties
  xtdb.serviceAccount:
    type: string
    title: XTDB Service Account
    x-google-marketplace:
      type: SERVICE_ACCOUNT
      serviceAccount:
        description: "Service account for XTDB."
  xtdb.persistence.storageClass:
    type: string
    title: StorageClass
    description: "StorageClass for XTDB persistent volumes. This determines the type of disk used for XTDB's local storage."
    x-google-marketplace:
      type: STORAGE_CLASS
      storageClass:
        type: SSD
        annotation:
          storageclass.kubernetes.io/is-default-class: "false"
  xtdb.persistence.size:
    type: string
    title: Storage size for persistent volumes
    default: "50Gi"
    description: "XTDB local disk cache size. This determines how much local storage is allocated for XTDB's cache."
    pattern: '^[1-9][0-9]*(\.[0-9]+)?[TGM]i?$'
  xtdb.adminPassword:
    type: string
    title: XTDB Admin Password
    description: "Password for the XTDB admin user. This is automatically generated."
    x-google-marketplace:
      type: GENERATED_PASSWORD
      generatedPassword:
        length: 16
  xtdbConfig.gcpProjectId:
    type: string
    title: GCP Project ID
    description: The Google Cloud project ID where XTDB will run.
    x-google-marketplace:
      type: STRING
  xtdbConfig.gcpBucket:
    type: string
    title: GCS Bucket 
    description: The GCS bucket to be used for XTDB storage.
    x-google-marketplace:
      type: STRING
  # Kafka configuration
  kafka.enabled:
    type: boolean
    default: true
    title: Enable Kafka
    description: "Whether to deploy Kafka as part of the application"
  
  kafka.replicaCount:
    type: integer
    default: 3
    minimum: 1
    maximum: 7
    title: Kafka Replica Count
    description: "Number of Kafka replicas to deploy"
  
  kafka.persistence.size:
    type: string
    default: "20Gi"
    title: Kafka Storage Size
    description: "Size of persistent storage for each Kafka replica"
    pattern: '^[1-9][0-9]*(\.[0-9]+)?[TGM]i?$'
  
  kafka.zookeeper.replicaCount:
    type: integer
    default: 3
    minimum: 1
    maximum: 7
    title: Zookeeper Replica Count
    description: "Number of Zookeeper replicas to deploy"
    
  # XTDB Kafka config
  xtdbConfig.kafkaBootstrapServers:
    type: string
    default: "kafka.xtdb-deployment.svc.cluster.local:9092"
    title: Kafka Bootstrap Servers
    description: "The Kafka bootstrap servers connection string"
    
  xtdbConfig.kafkaLogTopic:
    type: string
    default: "xtdb-log"
    title: Kafka Log Topic
    description: "The Kafka topic to use for XTDB log storage"

required:
  - name
  - namespace
  - xtdb.serviceAccount
  - xtdbConfig.gcpProjectId
  - xtdbConfig.gcpBucket
  - xtdb.adminPassword
  - xtdbConfig.kafkaBootstrapServers
  - xtdbConfig.kafkaLogTopic
