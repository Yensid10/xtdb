nodeCount: 3

# Use this one for the marketplace deployment
# image:
#   # These will be populated by marketplace deployment
#   registry: ""
#   repository: ""
#   tag: ""
#   pullPolicy: IfNotPresent

# Use this one for local development
image:
  registry: "us-central1-docker.pkg.dev"
  repository: "bcs-test-450214/xtdb-repo/xtdb"
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nodeSelector: {}

tolerations: []

affinity: {}

resources:
  limits:
    cpu: 1000m
    memory: 10Gi
    ephemeral-storage: 12Gi
  requests:
    cpu: 750m
    memory: 10Gi
    ephemeral-storage: 10Gi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

xtdbConfig:
  # REQUIRED
  # Kubernetes Service Account configured with Workload Identity Federation wih access to Google Cloud Storage
  serviceAccount: ""
  # Google Cloud Project ID 
  gcpProjectId: ""
  # Google Cloud Storage Bucket 
  gcpBucket: "" 
  # Kafka bootstrap servers
  kafkaBootstrapServers: "xtdb-kubernetes-deployment-kafka.xtdb-deployment.svc.cluster.local:9092"
  # XTDB log topic on Kafka 
  kafkaLogTopic: "xtdb-log"

  # OPTIONAL
  # JDK options - ensure that heap + direct memory + metaspace <= memory limit, and that some overhead is left for the OS
  # See https://docs.oracle.com/cd/E13150_01/jrockit_jvm/jrockit/jrdocs/refman/optionX.html
  jdkOptions: "-Xmx3000m -Xms3000m -XX:MaxDirectMemorySize=3000m -XX:MaxMetaspaceSize=500m"

  # We mount and use the below YAML for configuring the XTDB nodes and their modules.
  # The !Env values are set by Environment Variables set on the XTDB statefulset pods.
  # See the XTDB configuration documentation for options: https://docs.xtdb.com/ops/config.html

  nodeConfig: |-
    server:
      port: 5432

    log: !Kafka
      bootstrapServers: !Env KAFKA_BOOTSTRAP_SERVERS
      topic: !Env KAFKA_LOG_TOPIC
      propertiesMap:
        retries: "10"
        retry.backoff.ms: "1000"
        request.timeout.ms: "30000"
      autoCreateTopic: true

    storage: !Remote
      objectStore: !GoogleCloud
        projectId: !Env GCP_PROJECT_ID
        bucket: !Env GCP_BUCKET
        prefix: xtdb-object-store
      localDiskCache: /var/lib/xtdb/buffers/disk-cache

    healthz:
      port: 8080

    modules:
      - !HttpServer
        port: 3000

  # Volume size settings for XTDB Local Disk Cache (uses ephemeral storage)
  localDiskCache:
    sizeLimit: 8Gi  # Keep this below ephemeral-storage request

  # Extra Env:
  env:
    # (ENV_VAR_NAME: Value)
    XTDB_LOGGING_LEVEL: "info" # See https://docs.xtdb.com/ops/troubleshooting/overview.html

startupProbe:
  httpGet:
    path: /healthz/started
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 10 

livenessProbe:
  httpGet:
    path: /healthz/alive
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

xtdbService:
  type: LoadBalancer
  server:
    # Port of the Postgres Wire Server on the nodes
    targetPort: 5432
    # Port exposed by the service
    servicePort: 5432
  httpServer:
    # Port of the http server on the nodes
    targetPort: 3000
    # Port exposed by the service
    servicePort: 3000
  healthzServer:
    # Port of the healthz server on the nodes
    targetPort: 8080
    # Port exposed by the service
    servicePort: 8080

kafka:
  enabled: true
  replicaCount: 3
  persistence:
    size: "20Gi"
  zookeeper:
    replicaCount: 3
  autoCreateTopicsEnable: true
  configurationOverrides:
    "auto.create.topics.enable": "true"
    "default.replication.factor": "2"
    "min.insync.replicas": "1"
    "num.partitions": "3"
  listeners:
    client:
      name: PLAINTEXT
      port: 9092
      protocol: PLAINTEXT
  extraTopics:
    - name: xtdb-log
      partitions: 3
      replicationFactor: 2