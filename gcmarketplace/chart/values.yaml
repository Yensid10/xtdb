# Kafka configuration
kafka:
  enabled: true
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT

# XTDB configuration
nodeCount: 3

image:
  repository: us-central1-docker.pkg.dev/bcs-test-450214/quickstart-docker-repo/xtdb-image
  # tag: 2.0.0-beta5
  tag: latest
  pullPolicy: IfNotPresent

nodeSelector:
  iam.gke.io/gke-metadata-server-enabled: "true"
  # cloud.google.com/gke-ephemeral-storage-local-ssd: "true"
  # node_pool: "xtdb-pool"

tolerations: []

affinity: {}

resources:
  limits:
    cpu: "1000m"
    memory: "10G"
    ephemeral-storage: 100Gi
  requests:
    cpu: "750m"
    memory: "10G"
    ephemeral-storage: 100Gi

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

xtdbConfig:
  serviceAccount: "$serviceAccount"
  gcpProjectId: "$gcpProjectId"
  gcpBucket: "$gcpBucket"
  kafkaBootstrapServers: "$kafkaBootstrapServers"
  kafkaLogTopic: "$kafkaLogTopic"
  jdkOptions: "-Xmx3000m -Xms3000m -XX:MaxDirectMemorySize=3000m -XX:MaxMetaspaceSize=500m"
  nodeConfig: |-
    server:
      port: 5432
      tls:
        enabled: true
        keystore: /var/lib/xtdb/tls/keystore.p12
        keystorePassword: !Env TLS_KEYSTORE_PASSWORD

    log: !Kafka
      bootstrapServers: !Env KAFKA_BOOTSTRAP_SERVERS
      topic: !Env KAFKA_LOG_TOPIC

    storage: !Remote
      objectStore: !GoogleCloud
        projectId: !Env GCP_PROJECT_ID
        bucket: !Env GCP_BUCKET
        prefix: xtdb-object-store
      localDiskCache: /var/lib/xtdb/buffers/disk-cache

    modules:
    - !HttpServer
      port: 3000
      host: "127.0.0.1"  # Only accessible within the pod

    healthz:
      port: 8080
      host: "127.0.0.1"  # Only accessible within the pod

  # Volume size settings for XTDB Local Disk Cache (uses ephemeral storage)
  localDiskCache:
    sizeLimit: "50Gi"

  # Extra Env:
  env:
    # (ENV_VAR_NAME: Value)
    XTDB_LOGGING_LEVEL: "info" # See https://docs.xtdb.com/ops/troubleshooting/overview.html
    TLS_KEYSTORE_PASSWORD: "password" # Should be generated or provided securely

startupProbe:
  httpGet:
    path: /healthz/started
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 10 

livenessProbe:
  httpGet:
    path: /healthz/alive
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

xtdbService:
  type: LoadBalancer
  server:
    # Port of the Postgres Wire Server on the nodes
    targetPort: 5432
    # Port exposed by the service
    servicePort: 5432
  httpServer:
    # Port of the http server on the nodes
    targetPort: 3000
    # Port exposed by the service
    servicePort: null # Don't expose externally
  healthzServer:
    # Port of the healthz server on the nodes
    targetPort: 8080
    # Port exposed by the service
    servicePort: null # Don't expose externally
